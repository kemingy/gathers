[package]
name = "gatherspy"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "gatherspy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py39", "extension-module"] }
# https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#multiple-locations
gathers = { path = "../", version = "0.3.1"}
numpy = "0.29.0"

[lints.rust]
unsafe_code = "deny"

[workspace]

[patch.crates-io]
# Keep this standalone workspace on the same Pulp backport as the root workspace.
pulp = { git = "https://github.com/kemingy/pulp", rev = "120f46b0fce6d255dba91fd837bb79d8cfd4ea13" }
