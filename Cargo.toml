[workspace]
members = ["crates/rabitq", "crates/seed_rand"]
exclude = ["python"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
bytemuck = "1.25.0"
faer = { version = "0.24.0", default-features = false, features = ["linalg", "std"] }
pulp = "0.22.0"
rand = "0.10.0"
rayon = "1.12.0"

[package]
name = "gathers"
version = "0.3.1"
edition.workspace = true
authors = ["Keming <kemingy94@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/kemingy/gathers"
description = "Clustering algorithms."
documentation = "https://docs.rs/gathers"
keywords = ["cluster", "kmeans", "rabitq", "machine-learning", "vector-search"]
categories = ["algorithms", "science"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aligned-vec = "0.6.4"
argh = "0.1.19"
bytemuck.workspace = true
faer.workspace = true
log = "0.4.34"
logforth = { version = "0.30.0", features = ["starter-log"] }
num-traits = "0.2.19"
pulp.workspace = true
rabitq = { path = "crates/rabitq" }
rand.workspace = true
rayon.workspace = true

[profile.dev.package.faer]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.perf]
inherits = "release"
debug = true

[profile.bench]
codegen-units = 1
debug = true
lto = "thin"

[features]
default = []
# use single thread to make the perf clear
perf = []

[dev-dependencies]
criterion = "0.8.0"
seed-rand = { path = "crates/seed_rand" }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "kmeans"
harness = false
